<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aziz Zarrouki — software engineer</title>
  <desc id="desc">A dark technical banner focused on software engineering, full-stack development, interactive systems and robotics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#071622"/>
    </linearGradient>
    <linearGradient id="line" x1="170" y1="50" x2="1050" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65A7FF"/>
      <stop offset="0.5" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#35E0A1"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(140 70) rotate(32) scale(430 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6FEB" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientTransform="translate(1080 310) rotate(-150) scale(440 210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2BD89F" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2BD89F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#A7C7FF" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glowBlue)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glowGreen)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="url(#line)" stroke-opacity="0.55" stroke-width="2"/>

  <g opacity="0.9">
    <path d="M76 77H184L226 119H316" stroke="url(#line)" stroke-width="2"/>
    <circle cx="76" cy="77" r="5" fill="#65A7FF"/>
    <circle cx="226" cy="119" r="5" fill="#8B7CFF"/>
    <circle cx="316" cy="119" r="5" fill="#35E0A1"/>
    <path d="M884 258H968L1002 224H1124" stroke="url(#line)" stroke-width="2"/>
    <circle cx="884" cy="258" r="5" fill="#65A7FF"/>
    <circle cx="1002" cy="224" r="5" fill="#8B7CFF"/>
    <circle cx="1124" cy="224" r="5" fill="#35E0A1"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="74" width="184" height="212" rx="20" fill="#0C192A" stroke="#2D4564"/>
    <circle cx="112" cy="105" r="6" fill="#FF6B6B"/>
    <circle cx="134" cy="105" r="6" fill="#FFD166"/>
    <circle cx="156" cy="105" r="6" fill="#35E0A1"/>
    <path d="M112 154L138 180L112 206" stroke="#65A7FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M162 212H222" stroke="#35E0A1" stroke-width="8" stroke-linecap="round"/>
    <text x="111" y="252" fill="#7893B8" font-family="Consolas, 'Courier New', monospace" font-size="17">aziz@build:~$</text>
  </g>

  <g>
    <text x="320" y="112" fill="#8FB4E8" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="5">HELLO, I'M</text>
    <text x="316" y="186" fill="#F4F8FF" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="1">AZIZ ZARROUKI</text>
    <rect x="320" y="211" width="622" height="2" rx="1" fill="url(#line)"/>
    <text x="320" y="253" fill="#B8C9E3" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="0.8">SOFTWARE ENGINEERING  •  FULL-STACK  •  INTERACTIVE SYSTEMS  •  ROBOTICS</text>
    <text x="320" y="298" fill="#6F8AAE" font-family="Consolas, 'Courier New', monospace" font-size="17">engineering ideas into systems that work</text>
  </g>

  <g transform="translate(1030 82)">
    <circle cx="44" cy="44" r="43" fill="#0B1C2D" stroke="url(#line)" stroke-width="2"/>
    <text x="44" y="57" text-anchor="middle" fill="#F4F8FF" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">AZ</text>
  </g>
</svg>

